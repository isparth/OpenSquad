services:
  postgres:
    image: postgres:16-alpine
    container_name: opensquad-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: opensquad
      POSTGRES_PASSWORD: opensquad
      POSTGRES_DB: opensquad
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opensquad -d opensquad"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
