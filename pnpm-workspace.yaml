packages:
  - apps/*
  - packages/*
  - plugins/*

# Postinstall scripts are blocked by default. esbuild needs its own to install the native binary.
# Electron 42+ has no postinstall; apps/desktop runs `install-electron` from its own postinstall.
allowBuilds:
  esbuild: true
  electron: false
  electron-winstaller: false
  "@clerk/shared": false

# Seven-day dependency rule: react-markdown's parser chain resolved to micromark
# releases from 2026-09-26/27. Hold them at the previous releases until the new
# ones are old enough; delete an entry once its latest release qualifies.
# Dates are when the blocked release turns seven days old (UTC); re-check the
# lockfile diff on removal, since a newer release may have appeared meanwhile.
overrides:
  mdast-util-to-markdown: 2.1.2 # blocks 2.1.3 (2026-09-27); remove on/after 2026-10-04
  micromark: 4.0.2 # blocks 4.0.3 (2026-09-26); remove on/after 2026-10-03
  micromark-core-commonmark: 2.0.3 # blocks 2.0.4 (2026-09-26); remove on/after 2026-10-03
  micromark-factory-space: 2.0.1 # blocks 2.1.0 (2026-09-26); remove on/after 2026-10-03
  micromark-util-types: 2.0.2 # blocks 2.0.3 (2026-09-26); remove on/after 2026-10-03
